# Broxy4G : NetworkManager ne doit JAMAIS generer de connexion automatique
# pour un peripherique sans profil. Sans ce reglage, NM cree une connexion
# volatile (avec route par defaut) pendant la fenetre ou le profil d'un
# dongle est supprime puis reecrit, ce qui fait sortir la route par defaut de
# l'hote par le dongle (fuite d'isolation observee ~26 s le 2026-10-19).
[main]
no-auto-default=*

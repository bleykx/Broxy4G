[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "broxy4g"
version = "0.1.0"
description = "Gestionnaire de dongles 4G/5G Linux"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "alembic",
    "sqlalchemy>=2",
    "passlib>=1.7.4",
    "cryptography>=41",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
]

[project.scripts]
broxy4g = "broxy4g.main:main"

[project.urls]
Homepage = "https://github.com/yourusername/broxy4g"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
broxy4g = ["data/*.xml"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-ignore = ["E501", "B008", "B904"]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"